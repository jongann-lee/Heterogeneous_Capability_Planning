[project]
name = "heterogeneous-capability-planning"
version = "0.1.0"
description = "Centralized planning for heterogeneous agents on uncertain terrain"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cugraph-cu13==26.6.0",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.4,<2.5",
    "osmnx>=2.1.1",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "scipy>=1.18.0",
    "torch==2.12.0",
    "tqdm>=4.70.0",
    "wandb>=0.28.2",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
cugraph-cu13 = { index = "nvidia" }
